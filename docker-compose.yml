services:
  api:
    build: .
    container_name: feast-api
    ports:
      - "8082:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - feast

  db:
    image: mysql:8.0
    container_name: feast-db
    environment:
      MYSQL_DATABASE: banket
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - feast
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-psecret"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  feast:

volumes:
  db_data:
