services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: feast-app
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - feast
  db:
    image: mysql:8.0
    container_name: feast-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: banket
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - feast

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: feast-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "8085:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - feast

networks:
  feast:
    driver: bridge

volumes:
  db_data:
